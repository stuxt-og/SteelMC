[files]
extend-exclude = ["steel-registry/src/carver.rs", "steel-registry/build/carvers.rs", "**/build_assets/**", "*.json"]

[type.locale]
extend-glob = ["**/locale.rs"]
check-file = false

[default.extend-words]
flate = "flate"
strat = "strat"
axe = "axe"
# Vanilla stronghold piece-type IDs (shs, shsd, shrc, ...).
shs = "shs"

[default]
locale = "en-us"
